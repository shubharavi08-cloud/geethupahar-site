<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=3"></head><body>
<div class="adm" id="app"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});if(r.status===401){login();throw new Error('login')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const LN={hi:'Hindi',kn:'Kannada',ta:'Tamil',te:'Telugu',en:'English'};
function login(){$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:12vh auto"><h2>Admin login</h2><input type="password" id="pw" placeholder="Password" style="margin:14px 0"><button class="btn" id="lg">Login</button><div class="err" id="e"></div></div>`;
 const go=async()=>{try{await post('/api/admin/login',{password:$('#pw').value});list()}catch(e){$('#e').style.display='block';$('#e').textContent=e.message}};$('#lg').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function list(){const [me,rows]=await Promise.all([api('/api/admin/me'),api('/api/admin/orders')]);
 $('#app').innerHTML=`<div class="row2" style="justify-content:space-between"><h2>${esc(me.brand)} — orders</h2><span>${me.mock?'<span class="pill paid">TEST payments</span> ':''}<button class="btn ghost" style="padding:8px 16px;font-size:13px" id="cp">Change password</button> <button class="btn ghost" style="padding:8px 16px;font-size:13px" id="lo">Logout</button></span></div>
 ${me.live?'<div class="card" style="margin:12px 0;padding:12px 16px">✅ Online payment (Razorpay) is <b>ON</b>. <a href="#" id="whl" style="color:var(--gold)">Show webhook details</a><div id="whd" style="margin-top:8px;font-size:13px"></div></div>':`<div class="card" style="margin:12px 0;padding:14px 16px"><b>Switch on online payment</b><div style="color:var(--mut);font-size:13px;margin:4px 0 8px">Paste your Razorpay Live Key ID and Key Secret. They are checked with Razorpay and saved only on the server.</div><input id="rk" placeholder="Key ID (rzp_live_…)" value="${esc(me.rzpId||'rzp_live_U35J5jvXKvWQ0V')}" style="margin-bottom:8px"><input id="rs" type="password" placeholder="Key Secret" autocomplete="off"><button class="btn" id="rsave" style="margin-top:10px">Save and switch on</button><div id="rmsg" style="margin-top:8px"></div></div>`}
 <table class="tbl"><tr><th>#</th><th>For</th><th>Plan</th><th>Lang</th><th>Occasion</th><th>Status</th><th>Paid</th></tr>${rows.map(r=>`<tr class="row" data-id="${r.id}"><td>${r.id}</td><td>${esc(r.to_name)}<br><small style="color:var(--mut)">${esc(r.cust_name)}</small></td><td>${r.plan}</td><td>${LN[r.language]}</td><td>${esc(r.occasion)}</td><td><span class="pill ${r.status}">${r.status.replace('_',' ')}</span>${r.revision_note?' <span class="pill paid">fix requested</span>':''}</td><td>${r.paid_at?new Date(r.paid_at).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}):''}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--mut)">No orders yet.</td></tr>'}</table>`;
 const rb=$('#rsave');if(rb)rb.onclick=async()=>{rb.disabled=true;$('#rmsg').textContent='Checking with Razorpay…';try{await api('/api/admin/razorpay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('#rk').value,secret:$('#rs').value})});list()}catch(e){$('#rmsg').textContent='❌ '+e.message;rb.disabled=false}};
 const wl=$('#whl');if(wl)wl.onclick=async e=>{e.preventDefault();const w=await api('/api/admin/webhook-secret');$('#whd').innerHTML='URL: <b>'+esc(w.url)+'</b><br>Secret: <b>'+esc(w.wh||'')+'</b><br>Events: payment.captured, order.paid'};
 document.querySelectorAll('tr.row').forEach(t=>t.onclick=()=>detail(t.dataset.id));$('#cp').onclick=async()=>{const c=prompt('Current password');if(c===null)return;const n=prompt('New password (at least 10 characters)');if(!n)return;try{await api('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:c,next:n})});alert('Password changed.')}catch(e){alert(e.message)}};
 $('#lo').onclick=async()=>{await post('/api/admin/logout');login()}}
let poll;async function detail(id){clearTimeout(poll);const o=await api('/api/admin/orders/'+id);const photos=o.photos.map(p=>`<a href="/api/admin/orders/${id}/photo/${p}" target="_blank"><img src="/api/admin/orders/${id}/photo/${p}" style="width:84px;height:84px;object-fit:cover;border-radius:10px;margin:3px"></a>`).join('');
 const wa=`https://wa.me/91${o.phone}`;
 $('#app').innerHTML=`<p><a href="#" id="bk">← All orders</a></p><div class="row2" style="justify-content:space-between"><h2>#${o.id} — ${esc(o.to_name)} <span class="pill ${o.status}">${o.status.replace('_',' ')}</span></h2></div>
 ${['awaiting_payment','created'].includes(o.status)?`<div class="card" style="border-color:#f6c96b;margin-bottom:14px"><b>Payment not received yet.</b> Send the customer your UPI details on WhatsApp, and when the money arrives tap the button.<p style="margin-top:10px"><a class="btn ghost" style="padding:8px 16px;font-size:13px" target="_blank" href="https://wa.me/91${o.phone}?text=${encodeURIComponent('Namaste '+o.cust_name+'! Thank you for your order #'+o.id+' (₹'+o.amount/100+') for the song for '+o.to_name+'. Please pay by UPI and send the payment screenshot here. Your song starts once payment is received.')}">Message customer on WhatsApp</a> <button class="btn" style="padding:8px 16px;font-size:13px" id="mp">Mark payment received</button></p></div>`:''}
 <div class="grid g2"><div class="card"><dl class="kv"><dt>Plan</dt><dd>${o.plan} · ₹${o.amount/100}</dd><dt>Occasion</dt><dd>${esc(o.occasion)}</dd><dt>For</dt><dd>${esc(o.to_name)} (${esc(o.recipient)})</dd><dt>Pronounce</dt><dd>${esc(o.pronounce)||'—'}</dd><dt>From</dt><dd>${esc(o.from_name)||'—'}</dd><dt>Language</dt><dd>${LN[o.language]}</dd><dt>Style</dt><dd>${esc(o.genre)}</dd><dt>Customer</dt><dd>${esc(o.cust_name)} · <a href="${wa}" target="_blank">${esc(o.phone)} (WhatsApp)</a> ${o.email?'· '+esc(o.email):''}</dd><dt>Payment</dt><dd>${esc(o.rzp_payment)||'(test)'}</dd></dl>
 ${o.revision_note?`<p style="margin-top:12px"><span class="pill paid">Correction requested</span></p><div class="story">${esc(o.revision_note)}</div>`:''}
 <h3 style="margin:16px 0 6px">Story</h3><div class="story">${esc(o.story)}</div><p style="margin-top:8px"><button class="btn ghost" style="padding:8px 16px;font-size:13px" id="cp">Copy story for Suno</button></p></div>
 <div class="card"><h3>Photos</h3><div>${photos||'<small style="color:var(--mut)">none</small>'}</div>
 <h3 style="margin:16px 0 6px">1. Song</h3>${o.song_file?`<audio controls src="/api/admin/orders/${id}/file/audio" style="width:100%"></audio>`:''}
 <div class="row2"><label>Song (mp3/wav/m4a) <input type="file" id="sf" accept="audio/*"></label></div><div class="row2"><label>Timed lyrics .lrc (optional, best caption sync) <input type="file" id="lf" accept=".lrc,.txt"></label></div><button class="btn" style="padding:10px 22px;font-size:14px" id="up">Upload</button>
 ${o.plan==='video'?`<h3 style="margin:18px 0 6px">2. Video</h3>${o.video_file?`<video controls src="/api/admin/orders/${id}/file/video" style="width:100%;max-height:420px;border-radius:12px;background:#000"></video>`:''}
 <label class="f">Extra greeting cards (one per line, optional)</label><textarea id="wi" style="min-height:70px" placeholder="You are our shining star&#10;May every day bring you joy"></textarea>
 ${o.lrc_file?'':`<label class="f">Lyrics (one line per row — used for auto-timed captions if no .lrc)</label><textarea id="ly" style="min-height:110px"></textarea>`}
 <div class="row2"><select id="th" style="padding:10px;border-radius:10px"><option value="">Theme: auto</option><option>gold</option><option>rose</option><option>royal</option><option>saffron</option></select><button class="btn" style="padding:10px 22px;font-size:14px" id="rd" ${o.song_file?'':'disabled'}>${o.render_status==='rendering'?'Rendering…':'Render video'}</button></div><pre style="white-space:pre-wrap;font-size:12px;color:var(--mut)">${esc(o.render_status)} ${esc(o.log)}</pre>`:''}
 <h3 style="margin:18px 0 6px">3. Deliver</h3><button class="btn" id="dv" style="padding:10px 22px;font-size:14px">Mark delivered &amp; get WhatsApp link</button><div id="dres" style="margin-top:10px"></div>
 <label class="f">Private notes</label><textarea id="nt" style="min-height:60px">${esc(o.notes)}</textarea></div></div>`;
 $('#bk').onclick=e=>{e.preventDefault();clearTimeout(poll);list()};$('#cp').onclick=()=>navigator.clipboard.writeText(`Song for ${o.to_name} (${o.recipient}), ${o.occasion}, ${LN[o.language]}, ${o.genre}.\nPronounce: ${o.pronounce}\nFrom: ${o.from_name}\n\n${o.story}`);
 $('#up').onclick=async()=>{if(!$('#sf').files[0])return alert('Choose the song file');const fd=new FormData();fd.append('song',$('#sf').files[0]);if($('#lf').files[0])fd.append('lrc',$('#lf').files[0]);const r=await fetch(`/api/admin/orders/${id}/song`,{method:'POST',body:fd});if(!r.ok)return alert((await r.json()).error);detail(id)};
 const rd=$('#rd');if(rd)rd.onclick=async()=>{try{await post(`/api/admin/orders/${id}/render`,{theme:$('#th').value,wishes:$('#wi').value,lyrics_text:$('#ly')?.value||''});detail(id)}catch(e){alert(e.message)}};
 if(o.render_status==='rendering')poll=setTimeout(()=>detail(id),8000);
 $('#dv').onclick=async()=>{try{const r=await post(`/api/admin/orders/${id}/deliver`);$('#dres').innerHTML=`<a class="btn" href="${r.wa}" target="_blank">Open WhatsApp message</a><p style="margin-top:8px;font-size:13px;word-break:break-all">${esc(r.link)}</p>`}catch(e){alert(e.message)}};
 const mp=$('#mp');if(mp)mp.onclick=async()=>{if(!confirm('Mark payment received for order #'+id+'?'))return;try{const r=await post(`/api/admin/orders/${id}/markpaid`);window.open(r.wa,'_blank');detail(id)}catch(e){alert(e.message)}};
 $('#nt').onchange=()=>post(`/api/admin/orders/${id}/notes`,{notes:$('#nt').value})}
api('/api/admin/me').then(list).catch(()=>{});
</script></body></html>
