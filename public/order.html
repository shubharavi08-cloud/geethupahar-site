<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/logo-header.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create your song</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=3"><link rel="stylesheet" href="/cursor.css?v=3"></head><body>
<div class="wrap"><header class="top"><a class="logo" href="/" id="brand">Geeth Upahar</a><span id="stepno" style="color:var(--mut);font-size:14px"></span></header></div>
<div class="wz"><div class="bar"><i id="pb"></i></div><div id="stage"></div><div class="err" id="err"></div></div>
<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="next">Continue</button></div>
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
<script>
const $=s=>document.querySelector(s);let C={prices:{audio:499,video:999}};
const PRE=new URLSearchParams(location.search).get('occasion');const D={plan:new URLSearchParams(location.search).get('plan')==='audio'?'audio':'video',recipient:'',occasion:/^(birthday|anniversary|wedding|love|diwali|festival|devotional|friendship|thank-you|graduation|reel|other)$/.test(PRE||'')?PRE:'',language:'',genre:'',to_name:'',from_name:'',pronounce:'',story:'',cust_name:'',phone:'',email:'',consent:false};let photos=[];
const R=[['partner','💞','Partner'],['mother','🌸','Mother'],['father','🧔','Father'],['child','🧒','Child'],['sibling','👫','Brother / Sister'],['friend','🤝','Friend'],['grandparent','👵','Grandparent'],['teacher','📚','Teacher'],['self','✨','Myself'],['other','🎁','Someone else']];
const O=[['birthday','🎂','Birthday'],['anniversary','💞','Anniversary'],['wedding','💍','Wedding'],['love','❤️','Love / Proposal'],['diwali','🪔','Diwali'],['festival','🎉','Other festival'],['devotional','🙏','Devotional'],['friendship','🤝','Friendship'],['thank-you','💐','Thank you'],['graduation','🎓','Graduation'],['reel','🎬','Reel / social media'],['other','🎁','Just because']];
const L=[['hi','हिन्दी','Hindi'],['kn','ಕನ್ನಡ','Kannada'],['ta','தமிழ்','Tamil'],['te','తెలుగు','Telugu'],['en','English','']];
const G=[['soft-melody','Soft melody','Gentle and heartfelt'],['filmy-romantic','Filmy romantic','Like a movie song'],['classical-folk','Classical / folk','Traditional feel'],['pop','Upbeat pop','Fun and bright'],['acoustic','Acoustic','Guitar and simple'],['devotional','Devotional','Bhajan style'],['rap-fun','Fun rap','Playful and cheeky']];
const opts=(arr,key,withSub)=>`<div class="opts">${arr.map(a=>`<button type="button" class="opt ${D[key]===a[0]?'sel':''}" data-k="${key}" data-v="${a[0]}">${withSub?`${a[1]}<small>${a[2]}</small>`:`<div style="font-size:26px">${a[1]}</div>${a[2]}`}</button>`).join('')}</div>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=[
{t:'Who is this song for?',h:'Pick the closest relationship.',r:()=>opts(R,'recipient'),ok:()=>!!D.recipient},
{t:'What is the occasion?',h:'',skip:()=>!!PRE&&!!D.occasion&&!window.__chg,r:()=>opts(O,'occasion'),ok:()=>!!D.occasion},
{t:'Which language should we sing in?',h:'Names and key words will be sung naturally.',r:()=>opts(L.map(l=>[l[0],l[1],l[2]]),'language',true),ok:()=>!!D.language},
{t:'What style do you like?',h:'Pick the feel of the music.',r:()=>opts(G,'genre',true),ok:()=>!!D.genre},
{t:'Tell us their story',h:'The more you share, the more personal the song. Please do not mention singers\' names.',r:()=>`
<label class="f">Their name (as it should be sung)</label><input type="text" id="to_name" maxlength="60" value="${esc(D.to_name)}" placeholder="e.g. Ananya">
<label class="f">How to pronounce it (optional)</label><input type="text" id="pronounce" maxlength="200" value="${esc(D.pronounce)}" placeholder="e.g. Uh-nuh-nyaa">
<label class="f">From (your name or "Papa &amp; Amma")</label><input type="text" id="from_name" maxlength="60" value="${esc(D.from_name)}">
<label class="f">Your story — memories, nicknames, what you love about them, what you want to say</label><textarea id="story" maxlength="3000" placeholder="She loves dancing in the rain. We call her Chinnu. She just started college and we are so proud…">${esc(D.story)}</textarea><div id="cnt" style="color:var(--mut);font-size:13px;text-align:right"></div>`,
 ok:()=>{D.to_name=$('#to_name').value.trim();D.pronounce=$('#pronounce').value.trim();D.from_name=$('#from_name').value.trim();D.story=$('#story').value.trim();if(!D.to_name)return'Please enter their name.';if(D.story.length<40)return'Please write a few more sentences about them (at least 40 characters).';return true}},
{t:'Choose your song',h:'You can add photos in the next step for the video song.',r:()=>`<div class="opts" style="grid-template-columns:1fr 1fr"><button type="button" class="opt ${D.plan==='audio'?'sel':''}" data-k="plan" data-v="audio"><div style="font-size:26px">🎵</div>Audio song<small style="font-size:22px;color:var(--gold)">₹${C.prices.audio}</small><small>MP3</small></button><button type="button" class="opt ${D.plan==='video'?'sel':''}" data-k="plan" data-v="video"><div style="font-size:26px">🎬</div>Video song<small style="font-size:22px;color:var(--gold)">₹${C.prices.video}</small><small>With your photos</small></button></div>`,ok:()=>!!D.plan},
{t:'Add your photos',h:'3 to 12 clear photos (JPG/PNG). Faces make the best videos. We delete them 30 days after delivery.',skip:()=>D.plan!=='video',r:()=>`<div class="drop" id="drop">📸 Tap to choose photos<br><small style="color:var(--mut)">${photos.length} selected</small></div><input type="file" id="pf" accept="image/jpeg,image/png,image/webp" multiple hidden><div class="thumbs" id="th"></div>`,
 after:()=>{const pf=$('#pf');$('#drop').onclick=()=>pf.click();pf.onchange=()=>{for(const f of pf.files){if(photos.length<12&&f.size<=12*1048576)photos.push(f)}pf.value='';draw()};const draw=()=>{$('#drop').innerHTML=`📸 Tap to add photos<br><small style="color:var(--mut)">${photos.length} selected (3–12)</small>`;$('#th').innerHTML='';photos.forEach((f,i)=>{const im=new Image();im.src=URL.createObjectURL(f);im.title='Tap to remove';im.onclick=()=>{photos.splice(i,1);draw()};$('#th').appendChild(im)})};draw()},ok:()=>photos.length>=3?true:'Please add at least 3 photos.'},
{t:'Where should we send it?',h:'We will message you on WhatsApp when your song is ready.',r:()=>`<label class="f">Your name</label><input type="text" id="cust_name" maxlength="80" value="${esc(D.cust_name)}" autocomplete="name"><label class="f">WhatsApp number</label><input type="tel" id="phone" maxlength="14" value="${esc(D.phone)}" placeholder="10-digit mobile number" autocomplete="tel"><label class="f">Email (optional)</label><input type="email" id="email" maxlength="120" value="${esc(D.email)}" autocomplete="email">
<label class="chk"><input type="checkbox" id="consent" ${D.consent?'checked':''}><span>I agree to the <a href="/terms.html" target="_blank">Terms</a>, <a href="/privacy.html" target="_blank">Privacy Policy</a> and <a href="/refund.html" target="_blank">Refund Policy</a>, and I have the right to share these photos and details.</span></label>`,
 ok:()=>{D.cust_name=$('#cust_name').value.trim();D.phone=$('#phone').value.replace(/[^\d+]/g,'');D.email=$('#email').value.trim();D.consent=$('#consent').checked;if(!D.cust_name)return'Please enter your name.';if(!/^(\+?91)?[6-9]\d{9}$/.test(D.phone.replace(/^\+/,'')))return'Enter a valid 10-digit WhatsApp number.';if(!D.consent)return'Please accept the terms to continue.';return true}},
{t:'Review & pay',h:'',final:true,r:()=>{const g=(a,v)=>(a.find(x=>x[0]===v)||[])[2]||v;return`<div class="card sum"><div>For<b>${esc(D.to_name)} (${g(R,D.recipient)})</b></div><div>Occasion<b>${g(O,D.occasion)}</b></div><div>Language<b>${L.find(x=>x[0]===D.language)[1]}</b></div><div>Style<b>${G.find(x=>x[0]===D.genre)[1]}</b></div><div>Song<b>${D.plan==='video'?'Video song ('+photos.length+' photos)':'Audio song'}</b></div><div>Delivery<b>${C.delivery||''}</b></div><div style="font-size:20px">Total<b>₹${C.prices[D.plan]}</b></div></div><p style="color:var(--mut);font-size:14px;margin-top:12px">Secure payment by Razorpay — UPI, cards, netbanking.${C.mock?'<br><b style="color:var(--gold)">TEST MODE: no real payment will be taken.</b>':''}</p>`},ok:()=>true}
];
let i=0;const vis=()=>S.map((s,n)=>n).filter(n=>!(S[n].skip&&S[n].skip()));
function err(m){const e=$('#err');e.textContent=m||'';e.style.display=m?'block':'none'}
function show(){err('');const s=S[i];$('#stage').innerHTML=`<h2>${s.t}</h2><div class="hint">${s.h||''}</div>${s.r()}`;const v=vis();$('#pb').style.width=(100*(v.indexOf(i)+1)/v.length)+'%';$('#stepno').textContent=`Step ${v.indexOf(i)+1} of ${v.length}`;
 $('#back').style.visibility=i===0?'hidden':'visible';$('#next').textContent=s.final?`Pay ₹${C.prices[D.plan]}`:'Continue';$('#next').disabled=false;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{D[b.dataset.k]=b.dataset.v;document.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('sel',x===b));if(S[i].auto!==false&&!S[i].final&&['recipient','occasion','language','genre'].includes(b.dataset.k))setTimeout(go,180)});
 const st=$('#story');if(st){const c=()=>$('#cnt').textContent=st.value.length+' / 3000';st.oninput=c;c()}if(s.after)s.after();window.scrollTo(0,0)}
function go(){const s=S[i];const r=s.ok();if(r!==true&&!r)return err('Please choose an option to continue.');if(typeof r==='string')return err(r);const v=vis();const n=v[v.indexOf(i)+1];if(s.final)return pay();i=n;show()}
$('#back').onclick=()=>{const v=vis();i=v[v.indexOf(i)-1];show()};$('#next').onclick=go;
async function pay(){const b=$('#next');b.disabled=true;b.textContent='Please wait…';err('');
 try{const fd=new FormData();for(const k in D)fd.append(k,D[k]===true?'yes':D[k]);if(D.plan==='video')photos.forEach(f=>fd.append('photos',f));
  const r=await fetch('/api/orders',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');
  const done=()=>location.href='/o.html?t='+j.token+'&new=1';
  if(j.mock){await fetch(`/api/orders/${j.token}/mock-pay`,{method:'POST'});return done()}
  const rz=new Razorpay({key:j.rzp.key,amount:j.rzp.amount,currency:'INR',name:j.rzp.name,description:'Personalised song for '+D.to_name,order_id:j.rzp.order_id,prefill:j.rzp.prefill,theme:{color:'#f6c96b'},
   handler:async resp=>{const v=await fetch(`/api/orders/${j.token}/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(resp)});done()},modal:{ondismiss:()=>{b.disabled=false;b.textContent='Pay ₹'+C.prices[D.plan];err('Payment not completed. Your details are saved on this page — tap Pay to try again.')}}});
  rz.open()}catch(e){err(e.message);b.disabled=false;b.textContent='Pay ₹'+C.prices[D.plan]}}
fetch('/api/config').then(r=>r.json()).then(c=>{C=c;$('#brand').textContent=c.brand;document.title='Create your song — '+c.brand;show()});
</script></body></html>
